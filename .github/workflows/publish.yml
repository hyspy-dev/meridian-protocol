name: publish

# meridian-protocol is a library (consumed by proxy/core and Layer-1 modules), so it publishes to
# GitHub Packages. It also consumes meridian-api from Packages, so the Maven settings below carry a
# server for BOTH ids (read meridian-api, write meridian-protocol), both using GITHUB_TOKEN.
#
# NOTE: reading a package from another private org repo (meridian-api) with the default
# GITHUB_TOKEN requires that package's visibility to allow it (set meridian-api's package to
# "internal"/"public", or grant this repo access). Otherwise use a PAT with read:packages.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Maven settings (GitHub Packages auth for api + protocol)
        run: |
          cat > "$GITHUB_WORKSPACE/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
              <server><id>github-meridian-api</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
            </servers>
          </settings>
          EOF

      - name: Deploy to GitHub Packages
        run: mvn -B -ntp -DskipTests deploy -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
